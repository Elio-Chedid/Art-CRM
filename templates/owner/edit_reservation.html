{% extends "base.html" %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-lg" style="border-radius: 15px; border: none;">
                <div class="card-header bg-gradient-primary text-white" style="border-radius: 15px 15px 0 0;">
                    <h2 class="mb-0">
                        <i class="fas fa-edit"></i> Edit Reservation #{{ reservation.id }}
                    </h2>
                </div>
                <div class="card-body p-4">
                    <div class="alert alert-info mb-4">
                        <i class="fas fa-user"></i> <strong>Client:</strong> {{ reservation.client.name }} ({{ reservation.client.email }})
                    </div>
                    
                    <form method="POST">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label fw-bold">Title *</label>
                                <input type="text" class="form-control" name="title" value="{{ reservation.title }}" required>
                            </div>
                            
                            <div class="col-12">
                                <label class="form-label fw-bold">Description</label>
                                <textarea class="form-control" name="description" rows="3">{{ reservation.description }}</textarea>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Date & Time *</label>
                                <input type="datetime-local" class="form-control" name="date" 
                                       value="{{ reservation.date.strftime('%Y-%m-%dT%H:%M') }}" required>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Duration (minutes) *</label>
                                <input type="number" class="form-control" name="duration" value="{{ reservation.duration }}" required>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Price ($) *</label>
                                <input type="number" step="0.01" class="form-control" name="price" value="{{ reservation.price }}" required>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Location</label>
                                <input type="text" class="form-control" name="location" value="{{ reservation.location or '' }}">
                            </div>
                            
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Status *</label>
                                <select class="form-select" name="status" required>
                                    <option value="pending" {% if reservation.status == 'pending' %}selected{% endif %}>Pending</option>
                                    <option value="confirmed" {% if reservation.status == 'confirmed' %}selected{% endif %}>Confirmed</option>
                                    <option value="completed" {% if reservation.status == 'completed' %}selected{% endif %}>Completed</option>
                                    <option value="cancelled" {% if reservation.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
                                </select>
                            </div>
                            
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Payment Status *</label>
                                <select class="form-select" name="payment_status" required>
                                    <option value="unpaid" {% if reservation.payment_status == 'unpaid' %}selected{% endif %}>Unpaid</option>
                                    <option value="paid" {% if reservation.payment_status == 'paid' %}selected{% endif %}>Paid</option>
                                    <option value="partial" {% if reservation.payment_status == 'partial' %}selected{% endif %}>Partial</option>
                                    <option value="refunded" {% if reservation.payment_status == 'refunded' %}selected{% endif %}>Refunded</option>
                                </select>
                            </div>
                            
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Payment Method</label>
                                <select class="form-select" name="payment_method">
                                    <option value="">Not specified</option>
                                    <option value="cash" {% if reservation.payment_method == 'cash' %}selected{% endif %}>Cash</option>
                                    <option value="card" {% if reservation.payment_method == 'card' %}selected{% endif %}>Card</option>
                                    <option value="bank_transfer" {% if reservation.payment_method == 'bank_transfer' %}selected{% endif %}>Bank Transfer</option>
                                    <option value="paypal" {% if reservation.payment_method == 'paypal' %}selected{% endif %}>PayPal</option>
                                    <option value="stripe" {% if reservation.payment_method == 'stripe' %}selected{% endif %}>Stripe</option>
                                    <option value="other" {% if reservation.payment_method == 'other' %}selected{% endif %}>Other</option>
                                </select>
                            </div>
                            
                            <div class="col-12">
                                <button type="submit" class="btn btn-gradient btn-lg">
                                    <i class="fas fa-save"></i> Save Changes
                                </button>
                                <a href="{{ url_for('owner_reservations') }}" class="btn btn-outline-secondary btn-lg ms-2">
                                    <i class="fas fa-times"></i> Cancel
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
